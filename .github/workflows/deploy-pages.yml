name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static export for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Publish site to docs/ on main
        run: |
          rm -rf docs
          cp -R out docs
          touch docs/.nojekyll

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true

      - name: Commit docs/ for “Deploy from branch → main → /docs”
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ unchanged"
            exit 0
          fi
          git commit -m "chore: update static site in docs/ for GitHub Pages"
          git push

      - name: Enable Pages (requires repo admin token)
        continue-on-error: true
        run: |
          echo "## GitHub Pages setup" >> "$GITHUB_STEP_SUMMARY"
          echo "If https://adminskyreon.github.io/Motherhood_IVF_BookDoctor/ returns 404, enable Pages once:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Open Settings → Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Source: **Deploy from a branch**" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Branch **main** · folder **/docs** (or branch **gh-pages** · **/ (root)**)" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Save and wait 2–5 minutes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Org owners: Organization settings → Pages must allow Pages for this repository." >> "$GITHUB_STEP_SUMMARY"
